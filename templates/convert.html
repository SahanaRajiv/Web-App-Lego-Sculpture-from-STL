<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Sahana's STL to LEGO Converter</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(255,255,255,0.95) !important;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        .navbar-brand {
            font-weight: 700;
            color: #764ba2 !important;
        }
        .nav-link {
            font-weight: 600;
            color: #667eea !important;
        }
        .hero-section {
            text-align: center;
            padding: 40px 0 20px;
            color: white;
        }
        .hero-section h1 {
            font-weight: 700;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        .hero-section p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .form-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            margin-bottom: 40px;
        }
        .form-group label {
            font-weight: 600;
            color: #333;
        }
        .form-control, .form-control-file {
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            padding: 20px;
            min-height: 70px;
            font-size: 20px;
            color: #333 !important;
            background-color: #fff !important;
            -webkit-text-fill-color: #333 !important;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        select.form-control {
            color: #333 !important;
            -webkit-text-fill-color: #333 !important;
            opacity: 1 !important;
        }
        .form-control option {
            color: #333 !important;
            background-color: #fff !important;
        }
        .form-check {
            background: #f8f9fa;
            padding: 15px 15px 15px 40px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            padding: 12px 40px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .gallery-img {
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            max-height: 200px;
            object-fit: cover;
        }
        .section-title {
            color: #764ba2;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .loading-content {
            text-align: center;
            color: white;
        }
        .spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255,255,255,0.3);
            border-top: 8px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .progress-container {
            width: 300px;
            height: 20px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            margin: 20px auto;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .percent-text {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 10px;
        }
        .loading-text {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text">Building your LEGO model...</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="percent-text" id="percentText">0%</div>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="{{ url_for('index') }}">Sahana's STL to LEGO</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('index') }}">How to Use</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="{{ url_for('convert_page') }}">Convert</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('history') }}">History</a>
                </li>
            </ul>
        </div>
    </nav>
    
    <div class="hero-section">
        <h1>Sahana's STL to LEGO Converter</h1>
        <p>Transform your 3D models into buildable LEGO creations</p>
    </div>
    
    <div class="container">
        <div class="row mb-4">
            <div class="col-md-6">
                <img src="{{ url_for('static', filename='images/instruction_booklet.jpeg') }}" class="gallery-img w-100" alt="LEGO creations">
            </div>
            <div class="col-md-6">
                <img src="{{ url_for('static', filename='images/lego_duck.jpeg') }}" class="gallery-img w-100" alt="LEGO duck">
            </div>
        </div>
        
        <div class="form-card">
            <form action="/upload" method="post" enctype="multipart/form-data" id="convertForm">
                <h4 class="section-title">Select Your Model</h4>
                <div class="form-group">
                    <label for="file">Upload a new STL file</label>
                    <input type="file" class="form-control-file" id="file" name="file" accept=".stl">
                </div>
                {% if existing_files %}
                <div class="form-group">
                    <label for="existing_file">Or start with a bundled model</label>
                    <select class="form-control" id="existing_file" name="existing_file" style="color: #333;">
                        <option value="" style="color: #333;">-- Select existing file --</option>
                        {% for file in existing_files %}
                        <option value="{{ file }}" style="color: #333;"{% if file == 'Rubber_Duck.stl' %} selected{% endif %}>{{ starter_model_labels.get(file, file) }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% endif %}
                
                <h4 class="section-title mt-4">Configuration</h4>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="grid_voxel_count">Number of layers (10-100)</label>
                            <input type="number" class="form-control" id="grid_voxel_count" name="grid_voxel_count" min="10" max="100" value="15" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="grid_direction">Direction</label>
                            <select class="form-control" id="grid_direction" name="grid_direction" style="color: #333;">
                                <option value="x" style="color: #333;">X</option>
                                <option value="y" style="color: #333;">Y</option>
                                <option value="z" selected style="color: #333;">Z</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <h4 class="section-title mt-4">Options</h4>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="extract_shell" name="extract_shell" value="true">
                    <label class="form-check-label" for="extract_shell">Make model hollow (extract shell)</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="overlay_layers" name="overlay_layers" value="true" checked>
                    <label class="form-check-label" for="overlay_layers">Overlay layers for context</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="generate_pdf" name="generate_pdf" value="true" checked>
                    <label class="form-check-label" for="generate_pdf">Create PDF assembly instructions</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="color_by_shape" name="color_by_shape" value="true" checked>
                    <label class="form-check-label" for="color_by_shape">Color bricks by shape</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="remove_hanging_bricks" name="remove_hanging_bricks" value="true" checked>
                    <label class="form-check-label" for="remove_hanging_bricks">Remove Hanging Bricks (for non-hollow models)</label>
                </div>
                
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Convert to LEGO</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file');
        const existingFileSelect = document.getElementById('existing_file');

        // A newly selected upload always takes precedence over the starter model.
        if (fileInput && existingFileSelect) {
            fileInput.addEventListener('change', function() {
                if (this.files.length > 0) existingFileSelect.value = '';
            });
            existingFileSelect.addEventListener('change', function() {
                if (this.value) fileInput.value = '';
            });
        }

        document.getElementById('convertForm').addEventListener('submit', function() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            let percent = 0;
            let progressBar = document.getElementById('progressBar');
            let percentText = document.getElementById('percentText');
            
            let interval = setInterval(function() {
                if (percent < 95) {
                    percent += Math.random() * 3 + 0.5;
                    if (percent > 95) percent = 95;
                    progressBar.style.width = percent + '%';
                    percentText.textContent = Math.floor(percent) + '%';
                }
            }, 500);
        });
    </script>
</body>
</html>
