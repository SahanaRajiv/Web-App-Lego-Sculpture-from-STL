<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Results - Sahana's STL to LEGO Converter</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(255,255,255,0.95) !important;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        .navbar-brand {
            font-weight: 700;
            color: #764ba2 !important;
        }
        .nav-link {
            font-weight: 600;
            color: #667eea !important;
        }
        .content-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        h1 {
            color: #764ba2;
            font-weight: 700;
        }
        .btn-download {
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: 600;
            margin: 5px;
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
        }
        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .action-buttons {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="{{ url_for('index') }}">Sahana's STL to LEGO</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('convert_page') }}">Convert</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ user_manual_url }}" target="_blank" rel="noopener">User Manual</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('history') }}">History</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="content-card">
            <h1 class="text-center mb-4">Your LEGO Model</h1>
            
            <div class="action-buttons">
                <a href="{{ url_for('download_model', filename=model_filename) }}" class="btn btn-success btn-download">Download 3D Model (.stl)</a>
                {% if pdf_filename %}
                <a href="{{ url_for('download_pdf', filename=pdf_filename) }}" class="btn btn-danger btn-download">Download PDF Instructions</a>
                {% endif %}
                <a href="{{ url_for('convert_page') }}" class="btn btn-primary btn-download">Convert Another</a>
            </div>
            
            <div class="text-center mt-4">
                <p class="text-muted">Your PDF instructions contain layer-by-layer building guides with brick placement details.</p>
            </div>
        </div>
    </div>
</body>
</html>
