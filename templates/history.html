<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>History - Sahana's STL to LEGO Converter</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(255,255,255,0.95) !important;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        .navbar-brand {
            font-weight: 700;
            color: #764ba2 !important;
        }
        .nav-link {
            font-weight: 600;
            color: #667eea !important;
        }
        .content-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        h1 {
            color: #764ba2;
            font-weight: 700;
        }
        .list-group-item {
            border-radius: 10px !important;
            margin-bottom: 10px;
            border: none;
            background: #f8f9fa;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .list-group-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }
        .list-group-item a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }
        .list-group-item a:hover {
            color: #764ba2;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state h3 {
            color: #764ba2;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="{{ url_for('index') }}">Sahana's STL to LEGO</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('index') }}">How to Use</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('convert_page') }}">Convert</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="{{ url_for('history') }}">History</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="content-card">
            <h1 class="mb-4">Conversion History</h1>
            {% if results %}
            <ul class="list-group">
                {% for result in results %}
                    <li class="list-group-item">
                        <a href="{{ url_for('view_result', result_folder=result) }}">{{ result }}</a>
                    </li>
                {% endfor %}
            </ul>
            {% else %}
            <div class="empty-state">
                <h3>No conversions yet</h3>
                <p>Convert your first STL file to see it here!</p>
                <a href="{{ url_for('convert_page') }}" class="btn btn-primary" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 25px; padding: 12px 40px;">Start Converting</a>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
